<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>邓俨轩 · 数字媒体艺术本科生 | 个人简历</title>
<meta name="description" content="邓俨轩 — 南通理工学院数字媒体艺术本科生个人简历：设计基础、办公技能、软笔书法九级。">
<script>
  (function () {
    try {
      var t = localStorage.getItem('resume-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<style>
  /* ===================== 设计变量 ===================== */
  :root {
    --brand: #4f46e5;
    --brand-2: #7c3aed;
    --accent: #ec4899;
    --sky: #0ea5e9;

    --bg: #f4f5fb;
    --card: #ffffff;
    --card-2: #fafbff;
    --text: #141726;
    --text-2: #565c73;
    --text-3: #868da3;

    --border: rgba(20, 23, 38, .09);
    --nav-bg: rgba(255, 255, 255, .78);
    --track: rgba(79, 70, 229, .13);

    --shadow-sm: 0 1px 2px rgba(20, 23, 38, .05);
    --shadow: 0 2px 4px rgba(20, 23, 38, .04), 0 14px 32px -20px rgba(20, 23, 38, .38);
    --shadow-lg: 0 6px 14px rgba(20, 23, 38, .06), 0 26px 50px -24px rgba(79, 70, 229, .5);

    --radius: 18px;
    --radius-sm: 12px;
  }

  html[data-theme="dark"] {
    --bg: #0a0c13;
    --card: #141824;
    --card-2: #191e2d;
    --text: #eef1f8;
    --text-2: #a4abc1;
    --text-3: #7b839a;

    --border: rgba(255, 255, 255, .09);
    --nav-bg: rgba(10, 12, 19, .76);
    --track: rgba(124, 138, 255, .18);

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow: 0 2px 4px rgba(0, 0, 0, .35), 0 18px 40px -24px rgba(0, 0, 0, .95);
    --shadow-lg: 0 6px 14px rgba(0, 0, 0, .45), 0 30px 60px -30px rgba(0, 0, 0, 1);
  }

  /* ===================== 基础 ===================== */
  *, *::before, *::after { box-sizing: border-box; }

  html {
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
    scroll-padding-top: 84px;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    transition: color .25s ease;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(680px 430px at 8% -8%, rgba(79, 70, 229, .17), transparent 62%),
      radial-gradient(560px 400px at 94% 0%, rgba(236, 72, 153, .13), transparent 64%),
      radial-gradient(760px 540px at 50% 106%, rgba(14, 165, 233, .12), transparent 68%);
  }

  html[data-theme="dark"] body::before {
    background:
      radial-gradient(680px 430px at 8% -8%, rgba(99, 91, 255, .24), transparent 62%),
      radial-gradient(560px 400px at 94% 0%, rgba(236, 72, 153, .17), transparent 64%),
      radial-gradient(760px 540px at 50% 106%, rgba(14, 165, 233, .15), transparent 68%);
  }

  header, main, footer { position: relative; z-index: 1; }

  h1, h2, h3, h4 { line-height: 1.3; }
  img, svg { display: block; }
  button { font-family: inherit; }
  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .container {
    width: 100%;
    max-width: 1120px;
    margin-inline: auto;
    padding-inline: 24px;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ===================== 导航 ===================== */
  .nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--border);
  }

  .nav-inner {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 64px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    flex: 0 0 auto;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--brand), var(--accent));
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 8px 18px -8px rgba(79, 70, 229, .9);
  }

  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-text strong { font-size: 14.5px; letter-spacing: .02em; }
  .brand-text em {
    font-style: normal;
    font-size: 10.5px;
    color: var(--text-3);
    letter-spacing: .1em;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-left: auto;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding: 4px 2px;
    -webkit-overflow-scrolling: touch;
  }
  .nav-links::-webkit-scrollbar { display: none; }

  .nav-links a {
    position: relative;
    white-space: nowrap;
    text-decoration: none;
    color: var(--text-2);
    font-size: 13.5px;
    padding: 7px 12px;
    border-radius: 999px;
    transition: color .18s ease, background-color .18s ease;
  }
  .nav-links a:hover { color: var(--text); background: rgba(79, 70, 229, .09); }
  .nav-links a.is-active {
    color: var(--brand);
    background: rgba(79, 70, 229, .11);
    font-weight: 600;
  }

  .nav-tools {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-2);
    cursor: pointer;
    padding: 0;
    transition: transform .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .icon-btn:hover {
    transform: translateY(-1px);
    color: var(--brand);
    border-color: rgba(79, 70, 229, .4);
    box-shadow: var(--shadow-sm);
  }

  /* ===================== 按钮 / 徽章 ===================== */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13.5px;
    font-weight: 500;
    padding: 9px 15px;
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
    transition: transform .18s ease, box-shadow .18s ease,
                border-color .18s ease, background-color .18s ease;
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow);
    border-color: rgba(79, 70, 229, .42);
  }
  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 10px 22px -12px rgba(79, 70, 229, 1);
  }
  .btn-primary:hover {
    box-shadow: 0 14px 28px -12px rgba(79, 70, 229, 1);
    border-color: transparent;
  }

  .badge {
    font-size: 12.5px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-2);
    transition: transform .18s ease, color .18s ease, border-color .18s ease;
  }
  .badge:hover {
    transform: translateY(-2px);
    color: var(--brand);
    border-color: rgba(79, 70, 229, .4);
  }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
  .cta-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  /* ===================== 区块 ===================== */
  .section { padding: 58px 0; }

  .section-head { margin-bottom: 26px; }
  .section-head h2 {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: clamp(20px, 2.6vw, 25px);
    font-weight: 750;
    letter-spacing: .01em;
    margin: 0 0 6px;
  }
  .section-head h2::before {
    content: "";
    width: 6px;
    height: 22px;
    border-radius: 99px;
    background: linear-gradient(180deg, var(--brand), var(--accent));
    flex: 0 0 auto;
  }
  .section-head p { margin: 0; color: var(--text-2); font-size: 13.8px; }

  .sub-title {
    font-size: 15px;
    font-weight: 700;
    margin: 30px 0 14px;
  }

  /* ===================== Hero ===================== */
  .hero { padding: 54px 0 44px; }

  .hero-inner {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    gap: 40px;
    align-items: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: .09em;
    font-weight: 600;
    color: var(--brand);
    padding: 6px 13px;
    border-radius: 999px;
    background: rgba(79, 70, 229, .1);
    border: 1px solid rgba(79, 70, 229, .18);
    margin: 0 0 14px;
  }

  .hero h1 {
    font-size: clamp(34px, 6vw, 52px);
    font-weight: 800;
    letter-spacing: -.025em;
    line-height: 1.08;
    margin: 0 0 12px;
    background: linear-gradient(118deg, var(--text) 12%, var(--brand) 58%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hero-sub {
    color: var(--text-2);
    font-size: 14.6px;
    margin: 0 0 22px;
    max-width: 62ch;
  }

  .hero-card {
    padding: 22px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    display: grid;
    gap: 13px;
  }

  .hc-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 14px;
    font-size: 13.4px;
    padding-bottom: 12px;
    border-bottom: 1px dashed var(--border);
  }
  .hc-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .hc-row span { color: var(--text-3); flex: 0 0 auto; }
  .hc-row strong {
    font-weight: 600;
    text-align: right;
    word-break: break-word;
    min-width: 0;
  }

  /* ===================== 亮点 ===================== */
  .hl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
    gap: 16px;
  }

  .hl-card {
    position: relative;
    overflow: hidden;
    padding: 20px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .hl-card::after {
    content: "";
    position: absolute;
    right: -40px;
    bottom: -60px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(79, 70, 229, .18), transparent 70%);
    pointer-events: none;
  }
  .hl-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: rgba(79, 70, 229, .35);
  }

  .hl-value {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1.2;
    background: linear-gradient(120deg, var(--brand), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hl-label { font-weight: 650; font-size: 14px; margin-top: 5px; }
  .hl-desc { font-size: 12.4px; color: var(--text-3); margin-top: 5px; line-height: 1.55; }

  /* ===================== Tabs ===================== */
  .tablist {
    display: flex;
    gap: 5px;
    flex-wrap: nowrap;
    width: fit-content;
    max-width: 100%;
    padding: 5px;
    margin-bottom: 20px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .tablist::-webkit-scrollbar { display: none; }

  .tab {
    font-size: 13.4px;
    font-weight: 500;
    color: var(--text-2);
    padding: 8px 16px;
    border-radius: 999px;
    border: 0;
    background: transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .tab:hover { color: var(--text); background: rgba(79, 70, 229, .09); }
  .tab[aria-selected="true"] {
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff;
    box-shadow: 0 10px 20px -12px rgba(79, 70, 229, 1);
  }

  .tabpanel { animation: fadeUp .3s ease both; }
  .tabpanel:focus { outline: none; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  /* ===================== 时间线 ===================== */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }

  .timeline { display: grid; gap: 18px; }

  .tl-item { position: relative; padding-left: 30px; }
  .tl-item::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 28px;
    bottom: -18px;
    width: 2px;
    background: linear-gradient(180deg, rgba(79, 70, 229, .5), rgba(79, 70, 229, 0));
  }
  .tl-item:last-child::before { display: none; }
  .tl-item::after {
    content: "";
    position: absolute;
    left: 0;
    top: 22px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--card);
    border: 3px solid var(--brand);
    box-shadow: 0 0 0 4px rgba(79, 70, 229, .13);
  }

  .tl-body {
    padding: 20px 22px;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .tl-body:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
    border-color: rgba(79, 70, 229, .3);
  }

  .tl-top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 12px;
    margin-bottom: 10px;
  }
  .tl-role { font-size: 16px; font-weight: 700; margin: 0; }
  .tl-org { font-size: 13.4px; font-weight: 600; color: var(--brand); }
  .tl-time {
    margin-left: auto;
    font-size: 12.2px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
    background: rgba(79, 70, 229, .09);
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .bullets { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .bullets li {
    position: relative;
    padding-left: 18px;
    font-size: 13.9px;
    color: var(--text-2);
    line-height: 1.68;
  }
  .bullets li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: .68em;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--brand), var(--accent));
  }

  .tag-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .tag {
    font-size: 11.8px;
    padding: 4px 10px;
    border-radius: 8px;
    background: rgba(79, 70, 229, .09);
    color: var(--brand);
    border: 1px solid rgba(79, 70, 229, .16);
    white-space: nowrap;
  }
  .tag-soft {
    background: var(--card-2);
    color: var(--text-2);
    border-color: var(--border);
  }

  .empty-card {
    padding: 26px 22px;
    border-radius: var(--radius);
    border: 1px dashed var(--border);
    color: var(--text-3);
    font-size: 13.8px;
    text-align: center;
  }

  /* ===================== 项目 ===================== */
  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 18px;
  }

  .p-card {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 22px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .p-card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: linear-gradient(90deg, var(--brand), var(--accent));
    opacity: 0;
    transition: opacity .2s ease;
  }
  .p-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-lg);
    border-color: rgba(79, 70, 229, .3);
  }
  .p-card:hover::before { opacity: 1; }

  .p-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
  }
  .p-name { font-size: 16.4px; font-weight: 700; margin: 0; }
  .p-time { font-size: 11.8px; color: var(--text-3); white-space: nowrap; padding-top: 3px; }
  .p-meta { display: flex; flex-wrap: wrap; gap: 7px; }
  .p-desc { font-size: 13.6px; color: var(--text-2); margin: 12px 0 0; }
  .p-link {
    margin-top: 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--brand);
    text-decoration: none;
    align-self: flex-start;
  }
  .p-link:hover { text-decoration: underline; }

  /* ===================== 技能 ===================== */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(288px, 1fr));
    gap: 16px;
  }

  .skill-card {
    padding: 20px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .skill-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow);
    border-color: rgba(79, 70, 229, .28);
  }

  .skill-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .skill-name { font-weight: 700; font-size: 14.4px; }
  .skill-level {
    font-size: 11.8px;
    color: var(--brand);
    background: rgba(79, 70, 229, .1);
    border: 1px solid rgba(79, 70, 229, .16);
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .bar {
    height: 8px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
    margin-bottom: 14px;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--brand), var(--accent));
    transition: width 1s cubic-bezier(.2, .75, .25, 1);
  }

  .skill-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .skill-tags span {
    font-size: 11.8px;
    padding: 3px 9px;
    border-radius: 8px;
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--text-2);
  }

  /* ===================== 教育 / 证书 ===================== */
  .edu-card {
    padding: 24px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .edu-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

  .edu-top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 12px;
    margin-bottom: 14px;
  }
  .edu-school { font-size: 17.5px; font-weight: 800; margin: 0; }
  .edu-major { font-size: 13.6px; font-weight: 600; color: var(--brand); }
  .edu-badge {
    font-size: 11.8px;
    padding: 3px 10px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(79, 70, 229, .15), rgba(236, 72, 153, .15));
    color: var(--brand);
    border: 1px solid rgba(79, 70, 229, .22);
  }
  .edu-time {
    margin-left: auto;
    font-size: 12.2px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .cert-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(262px, 1fr));
    gap: 12px;
  }
  .cert {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    border-radius: var(--radius-sm);
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;

        if (Object.prototype.hasOwnProperty.call(opts.style, s)) node.style[s] = opts.style[s];
      }
    }
    if (children) {
      (Array.isArray(children) ? children : [children]).forEach(function (c) {
        if (c == null) return;
        node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
    }
    return node;
  }

  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }
  function hasText(v) { return typeof v === 'string' && v.trim() !== ''; }
  function nonEmpty(arr) { return Array.isArray(arr) && arr.length > 0; }

  var toastEl = $('#toast');
  var toastTimer = null;
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2000);
  }

  function getEmail() { return resume.emailUser + '@' + resume.emailDomain; }

  /* =========================================================
     3. Hero 渲染
     ========================================================= */
  function renderHero() {
    var eb = $('#heroEyebrow');
    if (eb) eb.textContent = resume.eyebrow || (resume.title + ' · ' + resume.school);

    var nameEl = $('#heroName');
    if (nameEl) nameEl.textContent = resume.name;

    var sumEl = $('#heroSummary');
    if (sumEl) sumEl.textContent = resume.summary;

    // 关键词徽章
    var badgeWrap = $('#heroBadges');
    if (badgeWrap) {
      clear(badgeWrap);
      if (nonEmpty(resume.keywords)) {
        resume.keywords.forEach(function (k) {
          badgeWrap.appendChild(el('span', { className: 'badge', text: k }));
        });
      } else {
        badgeWrap.style.display = 'none';
      }
    }

    // 侧边速览卡
    var card = $('#heroCard');
    if (card) {
      clear(card);
      var rows = [];
      rows.push({ k: '身份', v: resume.title + ' · ' + resume.school });
      if (hasText(resume.jobTarget)) rows.push({ k: '求职意向', v: resume.jobTarget });
      rows.push({ k: '所在城市', v: resume.location });
      rows.push({ k: '意向城市', v: resume.preferredCity });
      rows.push({ k: '预计毕业时间', v: resume.expectedGraduation });
      rows.push({ k: '电话', v: resume.phone });
      rows.push({ k: '微信', v: resume.wechat });
      rows.push({ k: '邮箱', v: getEmail() });
      if (hasText(resume.portfolio)) rows.push({ k: '作品集', v: resume.portfolio });
      if (hasText(resume.github)) rows.push({ k: 'GitHub', v: resume.github });

      rows.forEach(function (r) {
        card.appendChild(el('div', { className: 'hc-row' }, [
          el('span', { text: r.k }),
          el('strong', { text: r.v })
        ]));
      });
      if (!rows.length) card.style.display = 'none';
    }

    // 联系方式按钮
    var mailLink = $('#mailLink');
    if (mailLink) {
      if (hasText(resume.emailUser)) {
        mailLink.setAttribute('href', 'mailto:' + getEmail());
      } else {
        mailLink.style.display = 'none';
      }
    }
    var phoneLink = $('#phoneLink');
    if (phoneLink) {
      if (hasText(resume.phone)) {
        phoneLink.setAttribute('href', 'tel:' + resume.phone);
      } else {
        phoneLink.style.display = 'none';
      }
    }
    var copyBtn = $('#copyMailBtn');
    if (copyBtn && !hasText(resume.emailUser)) copyBtn.style.display = 'none';
  }

  /* =========================================================
     4. 亮点渲染
     ========================================================= */
  function renderHighlights() {
    var grid = $('#hlGrid');
    if (!grid) return;
    clear(grid);
    if (!nonEmpty(resume.highlights)) {
      $('#highlights').style.display = 'none';
      return;
    }
    resume.highlights.forEach(function (h) {
      grid.appendChild(el('article', { className: 'hl-card reveal' }, [
        el('div', { className: 'hl-value', text: h.value }),
        el('div', { className: 'hl-label', text: h.label }),
        hasText(h.desc) ? el('div', { className: 'hl-desc', text: h.desc }) : null
      ]));
    });
  }

  /* =========================================================
     5. 通用 Tabs 组件
     ========================================================= */
  function buildTabs(config) {
    // config: { tabsEl, panelsEl, baseId, items: [{label, render}], labelAttr }
    var tabsEl = config.tabsEl;
    var panelsEl = config.panelsEl;
    if (!tabsEl || !panelsEl) return;

    clear(tabsEl);
    clear(panelsEl);

    var tabs = config.tabs;
    if (tabs.length <= 1) {
      // 只有一个分类时不渲染 Tab 栏，直接展示内容
      tabsEl.style.display = 'none';
      var only = el('div', { className: 'tabpanel' });
      only.setAttribute('data-label', tabs[0] ? tabs[0].label : '');
      tabs[0].render(only);
      panelsEl.appendChild(only);
      return;
    }

    tabsEl.style.display = '';

    var tabButtons = [];
    var panels = [];

    tabs.forEach(function (t, i) {
      var id = config.baseId + '-tab-' + i;
      var panelId = config.baseId + '-panel-' + i;

      var btn = el('button', {
        className: 'tab',
        text: t.label,
        attrs: {
          type: 'button',
          role: 'tab',
          id: id,
          'aria-controls': panelId,
          'aria-selected': i === 0 ? 'true' : 'false',
          tabindex: i === 0 ? '0' : '-1'
        }
      });
      tabButtons.push(btn);
      tabsEl.appendChild(btn);

      var panel = el('div', { className: 'tabpanel', attrs: { role: 'tabpanel', id: panelId, 'aria-labelledby': id } });
      panel.setAttribute('data-label', t.label);
      if (i !== 0) panel.hidden = true;
      panel.tabIndex = 0;
      t.render(panel);
      panels.push(panel);
      panelsEl.appendChild(panel);
    });

    function activate(idx, focus) {
      tabButtons.forEach(function (b, i) {
        var on = i === idx;
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
        panels[i].hidden = !on;
      });
      if (focus) tabButtons[idx].focus();
    }

    tabButtons.forEach(function (btn, i) {
      btn.addEventListener('click', function () { activate(i, false); });
      btn.addEventListener('keydown', function (e) {
        var key = e.key;
        var next = null;
        if (key === 'ArrowRight' || key === 'ArrowDown') next = (i + 1) % tabButtons.length;
        else if (key === 'ArrowLeft' || key === 'ArrowUp') next = (i - 1 + tabButtons.length) % tabButtons.length;
        else if (key === 'Home') next = 0;
        else if (key === 'End') next = tabButtons.length - 1;
        if (next != null) {
          e.preventDefault();
          activate(next, true);
        }
      });
    });

    activate(0, false);
  }

  /* =========================================================
     6. 经历渲染
     ========================================================= */
  function expCard(item) {
    var body = el('div', { className: 'card tl-body' });

    var top = el('div', { className: 'tl-top' }, [
      el('h3', { className: 'tl-role', text: item.role }),
      hasText(item.org) ? el('span', { className: 'tl-org', text: item.org }) : null,
      hasText(item.time) ? el('span', { className: 'tl-time', text: item.time }) : null
    ]);
    body.appendChild(top);

    if (nonEmpty(item.bullets)) {
      var ul = el('ul', { className: 'bullets' });
      item.bullets.forEach(function (b) { ul.appendChild(el('li', { text: b })); });
      body.appendChild(ul);
    }

    if (nonEmpty(item.tags)) {
      var tr = el('div', { className: 'tag-row' });
      item.tags.forEach(function (t) { tr.appendChild(el('span', { className: 'tag', text: t })); });
      body.appendChild(tr);
    }
    return body;
  }

  function renderExperiences() {
    var list = resume.experiences || [];
    var tabsEl = $('#expTabs');
    var panelsEl = $('#expPanels');
    if (!tabsEl || !panelsEl) return;

    if (!list.length) {
      $('#experience').style.display = 'none';
      return;
    }

    var types = [];
    list.forEach(function (it) {
      if (types.indexOf(it.type) === -1) types.push(it.type);
    });

    var tabs = [];
    if (types.length > 1) {
      tabs.push({
        label: '全部',
        render: function (panel) {
          var wrap = el('div', { className: 'timeline' });
          list.forEach(function (it) {
            wrap.appendChild(el('div', { className: 'tl-item' }, expCard(it)));
          });
          panel.appendChild(wrap);
        }
      });
    }
    types.forEach(function (type) {
      tabs.push({
        label: type,
        render: function (panel) {
          var wrap = el('div', { className: 'timeline' });
          list.filter(function (it) { return it.type === type; }).forEach(function (it) {
            wrap.appendChild(el('div', { className: 'tl-item' }, expCard(it)));
          });
          panel.appendChild(wrap);
        }
      });
    });

    buildTabs({ tabsEl: tabsEl, panelsEl: panelsEl, baseId: 'exp', tabs: tabs });
  }

  /* =========================================================
     7. 项目渲染
     ========================================================= */
  function projectCard(item) {
    var card = el('article', { className: 'card p-card' });

    card.appendChild(el('div', { className: 'p-head' }, [
      el('h3', { className: 'p-name', text: item.name }),
      hasText(item.time) ? el('span', { className: 'p-time', text: item.time }) : null
    ]));

    var metaItems = [];
    if (hasText(item.role)) metaItems.push(item.role);
    if (nonEmpty(item.stack)) metaItems = metaItems.concat(item.stack);
    if (metaItems.length) {
      var meta = el('div', { className: 'p-meta' });
      metaItems.forEach(function (m) { meta.appendChild(el('span', { className: 'tag', text: m })); });
      card.appendChild(meta);
    }

    if (hasText(item.desc)) card.appendChild(el('p', { className: 'p-desc', text: item.desc }));

    if (hasText(item.link)) {
      card.appendChild(el('a', {
        className: 'p-link',
        text: '查看详情 →',
        attrs: { href: item.link, target: '_blank', rel: 'noopener noreferrer' }
      }));
    }
    return card;
  }

  function renderProjects() {
    var list = resume.projects || [];
    var tabsEl = $('#projTabs');
    var panelsEl = $('#projPanels');
    if (!tabsEl || !panelsEl) return;

    if (!list.length) {
      $('#projects').style.display = 'none';
      return;
    }

    var types = [];
    list.forEach(function (it) {
      var t = it.type || '项目';
      if (types.indexOf(t) === -1) types.push(t);
    });

    function gridFor(items) {
      var g = el('div', { className: 'project-grid' });
      items.forEach(function (it) { g.appendChild(projectCard(it)); });
      return g;
    }

    var tabs = [];
    if (types.length > 1) {
      tabs.push({
        label: '全部',
        render: function (panel) { panel.appendChild(gridFor(list)); }
      });
    }
    types.forEach(function (type) {
      tabs.push({
        label: type,
        render: function (panel) {
          panel.appendChild(gridFor(list.filter(function (it) { return (it.type || '项目') === type; })));
        }
      });
    });

    buildTabs({ tabsEl: tabsEl, panelsEl: panelsEl, baseId: 'proj', tabs: tabs });
  }

  /* =========================================================
     8. 技能渲染
     ========================================================= */
  function renderSkills() {
    var grid = $('#skillGrid');
    if (!grid) return;
    clear(grid);

    if (!nonEmpty(resume.skills)) {
      $('#skills').style.display = 'none';
      return;
    }

    resume.skills.forEach(function (s) {
      var card = el('article', { className: 'skill-card reveal' });

      card.appendChild(el('div', { className: 'skill-top' }, [
        el('span', { className: 'skill-name', text: s.name }),
        hasText(s.level) ? el('span', { className: 'skill-level', text: s.level }) : null
      ]));

      var bar = el('div', { className: 'bar', attrs: {
        role: 'progressbar',
        'aria-valuemin': '0',
        'aria-valuemax': '100',
        'aria-valuenow': String(s.pct || 0),
        'aria-label': s.name + ' 熟练度'
      } });
      var fill = el('i', { attrs: { 'data-pct': String(s.pct || 0) } });
      bar.appendChild(fill);
      card.appendChild(bar);

      if (nonEmpty(s.tags)) {
        var tags = el('div', { className: 'skill-tags' });
        s.tags.forEach(function (t) { tags.appendChild(el('span', { text: t })); });
        card.appendChild(tags);
      }

      grid.appendChild(card);
    });
  }

  /* =========================================================
     9. 教育与证书渲染
     ========================================================= */
  function renderEducation() {
    var wrap = $('#eduWrap');
    if (!wrap) return;
    clear(wrap);

    var edu = resume.education;
    var hasEdu = edu && (hasText(edu.school) || nonEmpty(edu.courses) || nonEmpty(edu.bullets));
    var hasCerts = nonEmpty(resume.certificates);

    if (!hasEdu && !hasCerts) {
      $('#education').style.display = 'none';
      return;
    }

    if (hasEdu) {
      var card = el('div', { className: 'card edu-card reveal' });

      var top = el('div', { className: 'edu-top' }, [
        el('h3', { className: 'edu-school', text: edu.school }),
        hasText(edu.major) ? el('span', { className: 'edu-major', text: edu.major + (hasText(edu.degree) ? ' · ' + edu.degree : '') }) : null,
        hasText(edu.stage) ? el('span', { className: 'edu-badge', text: edu.stage }) : null,
        hasText(edu.time) ? el('span', { className: 'edu-time', text: edu.time }) : null
      ]);
      card.appendChild(top);

      if (nonEmpty(edu.bullets)) {
        var ul = el('ul', { className: 'bullets' });
        edu.bullets.forEach(function (b) { ul.appendChild(el('li', { text: b })); });
        card.appendChild(ul);
      }

      if (nonEmpty(edu.courses)) {
        card.appendChild(el('div', { className: 'sub-title', text: '主修课程' }));
        var tr = el('div', { className: 'tag-row' });
        edu.courses.forEach(function (c) { tr.appendChild(el('span', { className: 'tag tag-soft', text: c })); });
        card.appendChild(tr);
      }

      if (nonEmpty(edu.extras)) {
        var ul2 = el('ul', { className: 'bullets', style: { marginTop: '14px' } });
        edu.extras.forEach(function (b) { ul2.appendChild(el('li', { text: b })); });
        card.appendChild(ul2);
      }

      wrap.appendChild(card);
    }

    if (hasCerts) {
      wrap.appendChild(el('div', { className: 'sub-title', text: '证书与荣誉' }));
      var list = el('div', { className: 'cert-list' });
      resume.certificates.forEach(function (c) {
        var icon = el('span', { className: 'cert-icon', html:
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
          'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<circle cx="12" cy="8" r="6"></circle>' +
          '<path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"></path></svg>' });
        list.appendChild(el('div', { className: 'cert reveal' }, [
          icon,
          el('div', {}, [
            el('div', { className: 'cert-name', text: c.name }),
            hasText(c.meta) ? el('div', { className: 'cert-meta', text: c.meta }) : null
          ])
        ]));
      });
      wrap.appendChild(list);
    }
  }

  /* =========================================================
     10. 页脚
     ========================================================= */
  function renderFooter() {
    var y = $('#year');
    if (y) y.textContent = String(new Date().getFullYear());
    var note = $('#footerNote');
    if (note && hasText(resume.updated)) {
      note.textContent = '本网站仅为初版设计原型，后续将持续优化。最后更新：' + resume.updated + '。';
    }
  }

  /* =========================================================
     11. 交互：主题 / 打印 / 复制邮箱 / 返回顶部 / 导航高亮
     ========================================================= */
  var SUN = '<circle cx="12" cy="12" r="4"></circle>' +
            '<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>';
  var MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>';

  function setupTheme() {
    var btn = $('#themeBtn');
    var icon = $('#themeIcon');
    if (!btn || !icon) return;

    function sync() {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      icon.innerHTML = dark ? MOON : SUN;
      btn.setAttribute('aria-label', dark ? '切换到浅色模式' : '切换到深色模式');
    }

    btn.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('resume-theme', next); } catch (e) {}
      sync();
    });

    sync();
  }

  function setupPrint() {
    var btn = $('#printBtn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      try { window.print(); } catch (e) { toast('当前环境不支持打印'); }
    });
  }

  function setupCopyMail() {
    var btn = $('#copyMailBtn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var email = getEmail();
      function fallback() {
        try {
          var ta = document.createElement('textarea');
          ta.value = email;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          toast(ok ? '邮箱已复制：' + email : '复制失败，请手动复制：' + email);
        } catch (e) {
          toast('复制失败，请手动复制：' + email);
        }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(function () {
          toast('邮箱已复制：' + email);
        }).catch(fallback);
      } else {
        fallback();
      }
    });
  }

  function setupToTop() {
    var btn = $('#toTop');
    if (!btn) return;
    var ticking = false;

    function update() {
      if (window.scrollY > 420) btn.classList.add('show');
      else btn.classList.remove('show');
      ticking = false;
    }

    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
    }, { passive: true });

    btn.addEventListener('click', function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });

    update();
  }

  function setupNavHighlight() {
    var links = $all('#navLinks a');
    if (!links.length) return;

    var map = {};
    links.forEach(function (a) {
      var id = a.getAttribute('href').slice(1);
      var sec = document.getElementById(id);
      if (sec) map[id] = a;
    });

    var ids = Object.keys(map);
    if (!ids.length) return;

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) {
            links.forEach(function (l) { l.classList.remove('is-active'); });
            var a = map[en.target.id];
            if (a) a.classList.add('is-active');
          }
        });
      }, { rootMargin: '-88px 0px -62% 0px', threshold: 0 });

      ids.forEach(function (id) { io.observe(document.getElementById(id)); });
    }

    links.forEach(function (a) {
      a.addEventListener('click', function (e) {
        var id = a.getAttribute('href').slice(1);
        var target = document.getElementById(id);
        if (!target) return;
        e.preventDefault();
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var top = target.getBoundingClientRect().top + window.scrollY - 76;
        window.scrollTo({ top: top, behavior: reduce ? 'auto' : 'smooth' });
        links.forEach(function (l) { l.classList.remove('is-active'); });
        a.classList.add('is-active');
      });
    });
  }

  function setupReveal() {
    var items = $all('.reveal');
    if (!items.length) return;

    if (!('IntersectionObserver' in window)) {
      items.forEach(function (i) { i.classList.add('in'); });
      return;
    }

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          en.target.classList.add('in');
          io.unobserve(en.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });

    items.forEach(function (i) { io.observe(i); });
  }

  function setupSkillBars() {
    var bars = $all('.bar > i');
    if (!bars.length) return;

    function fill(el) {
      var pct = parseFloat(el.getAttribute('data-pct')) || 0;
      el.style.width = Math.max(0, Math.min(100, pct)) + '%';
    }

    if (!('IntersectionObserver' in window)) {
      bars.forEach(fill);
      return;
    }

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          var target = en.target;
          setTimeout(function () { fill(target); }, 80);
          io.unobserve(target);
        }
      });
    }, { threshold: 0.2 });

    bars.forEach(function (b) { io.observe(b); });
  }

  /* =========================================================
     12. 启动
     ========================================================= */
  function boot() {
    try {
      renderHero();
      renderHighlights();
      renderExperiences();
      renderProjects();
      renderSkills();
      renderEducation();
      renderFooter();
    } catch (err) {
      // 渲染异常时保证页面不空白
      console.error('[resume] render error:', err);
      if (!document.querySelector('#heroName').textContent) {
        document.querySelector('#heroName').textContent = resume.name;
      }
      if (!document.querySelector('#heroSummary').textContent) {
        document.querySelector('#heroSummary').textContent = resume.summary;
      }
    }

    setupTheme();
    setupPrint();
    setupCopyMail();
    setupToTop();
    setupNavHighlight();
    setupReveal();
    setupSkillBars();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
